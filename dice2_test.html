<!DOCTYPE html>
<meta charset="utf-8">
<!--Pyscriptを読み込む-->>
<script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>
<!--Pythonのプログラム-->
<script type="mpy">

        # どのモジュールを使うのか宣言

    pyscript.display("サイコロの目は")
    pyscript.display(random.randint(1, 6))

</script>
