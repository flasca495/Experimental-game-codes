
<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>チーム分けアプリ</title>

    <link rel="stylesheet" href="./style.css">

    <script type="module"
        src="https://pyscript.net/releases/2025.8.1/core.js"></script>
    <script type="mpy" src="./team_maker.py"></script>
</head>
<body>
    <h1>チーム分けアプリ</h1>

    <label for="names">参加者の名前（1行に1人）</label>
    <textarea id="names" rows="8"
        placeholder="Aさん&#10;Bさん&#10;Cさん"></textarea>

    <label for="team_count">チーム数</label>
    <select id="team_count">
        <option value="2">2チーム</option>
        <option value="3">3チーム</option>
        <option value="4">4チーム</option>
    </select>

    <button mpy-click="make_teams">チーム分けする</button>

    <p id="message"></p>
    <div id="result"></div>
</body>
</html>
